; Somnium — Seeed XIAO ESP32S3 Sense (8 MB flash, 8 MB octal PSRAM)
; Kickstarter keychain: OV5640, onboard microSD, BLE + short-lived SoftAP.
; This branch does not join a home Wi-Fi network.
[env:xiao_esp32s3_sense]
platform = espressif32@7.1.3
board = seeed_xiao_esp32s3
framework = arduino
board_upload.flash_size = 8MB
board_build.flash_size = 8MB
board_build.partitions = partitions/xiao_esp32s3_sense.csv
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
monitor_speed = 115200
upload_speed = 460800
lib_deps =
  adafruit/Adafruit ST7735 and ST7789 Library@1.12.0
  adafruit/Adafruit GFX Library@1.12.6
  adafruit/Adafruit BusIO@1.16.2
  bodmer/TJpg_Decoder@1.1.0
  https://github.com/0015/ESP32-OV5640-AF.git
build_flags =
  -D CORE_DEBUG_LEVEL=0
  -D BOARD_HAS_PSRAM
  -I include
  ; Native USB CDC. D6/GPIO43 and D7/GPIO44 are the shutter and backlight,
  ; not UART0. Do not enable USB-CDC-off UART logging on those pins.
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
