; Project Somnium — Freenove ESP32-S3 WROOM CAM (N16R8)
[env:somnium]
platform = espressif32@7.1.3
board = freenove_esp32_s3_wroom
framework = arduino
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
monitor_speed = 921600
monitor_dtr = 0
monitor_rts = 0
upload_speed = 460800
lib_deps =
  adafruit/Adafruit ILI9341@1.6.3
  adafruit/Adafruit GFX Library@1.12.6
  adafruit/Adafruit BusIO@1.17.4
  bodmer/TJpg_Decoder@1.1.0
  ; 1.4.3 matches Arduino-ESP32 2.0.17 (espressif32 7.1.3 / IDF 4.4).
  ; NimBLE 2.x needs Arduino core 3 and will not build here.
  ; With SOMNIUM_BLE=0 the sources still compile, and --gc-sections
  ; drops them from the image because nothing references NimBLE.
  h2zero/NimBLE-Arduino@1.4.3
build_flags =
  -D CORE_DEBUG_LEVEL=0
  -I include
  ; UART0 → onboard CH340 (/dev/ttyACM* usb-1a86_*). USB cook uses this path.
  -DARDUINO_USB_MODE=0
  -DARDUINO_USB_CDC_ON_BOOT=0
  ; Phone link. Set to 0 for a USB-only image.
  -DSOMNIUM_BLE=1
  ; NimBLE host, sized for one phone beside the camera and the 64 KB USB RX
  ; buffer. These must be visible to every NimBLE translation unit.
  ; Peripheral only: central is ~7 KB flash, scanning ~26 KB, both unused.
  -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
  -DCONFIG_BT_NIMBLE_MAX_BONDS=1
  -DCONFIG_BT_NIMBLE_MAX_CCCDS=6
  -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
  -DCONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED
  -DCONFIG_BT_NIMBLE_ATT_PREFERRED_MTU=185
  ; Host mbufs in PSRAM. The BT controller stays in internal RAM.
  -DCONFIG_BT_NIMBLE_MEM_ALLOC_MODE_EXTERNAL=1
  -DCONFIG_BT_NIMBLE_LOG_LEVEL=5
  -DCONFIG_NIMBLE_CPP_LOG_LEVEL=0
